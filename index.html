      '<section class="card"><h2 style="margin-bottom:8px">Comment l’utiliser</h2><ol class="steps"><li>Suis les notions dans l’ordre du cahier (menu <b>Parcours</b>).</li><li>Dans chaque notion : lis la théorie, manipule la simulation, fais les exercices, puis le <b>test de maîtrise</b> (4/5 pour valider).</li><li>Reprends tes erreurs dans <b>Pratiquer mes difficultés</b>.</li><li>Avant l’examen : fiches de révision, puis un ou plusieurs <b>examens blancs</b>.</li></ol></section>' +
      '<section class="card"><h2 style="margin-bottom:8px">Tes données</h2><p>Aucun compte, aucun nom, aucune donnée personnelle. Ta progression (réponses, XP, badges, examen en cours) est enregistrée <b>seulement dans ce navigateur</b>, sur cet appareil. Elle n’est envoyée nulle part et personne d’autre ne la voit, pas même ton enseignant.</p><p class="muted">Conséquences : ta progression ne suit pas d’un appareil à l’autre, et elle disparaît si tu effaces les données du navigateur ou si tu utilises la navigation privée.</p><div class="btn-row"><button class="btn" data-reset>Effacer ma progression</button></div><div id="rz"></div></section>' +
      '<section class="card"><h2 style="margin-bottom:8px">Limites de cette version</h2><ul><li>Pas d’espace enseignant ni de résultats de groupe : la plateforme fonctionne sans serveur.</li><li>La maîtrise affichée est une <b>estimation</b> basée sur tes réponses, pas une mesure exacte de ton niveau.</li><li>La banque contient ' + D.questions.length + ' questions (de 8 à 18 par notion). Un examen de 40 questions réutilisera souvent des questions déjà vues.</li><li>Le contenu de l’examen réel n’est pas connu : les questions préparent aux notions du cahier.</li><li>Le mot mystère de la page 25 n’est pas intégré (voir ci-dessous).</li></ul></section>' +
      '<section class="card"><h2 style="margin-bottom:8px">Points ambigus repérés dans les documents</h2><ul>' + D.flags.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ul></section>' +
      '<section class="card"><h2 style="margin-bottom:8px">Sources</h2><p>Cahier « Thématique 2 — Origine et évolution de la vie sur Terre », Science et technologie, secondaire 3 (2026-2027) et son corrigé 2026. Références aux manuels Synergie et Observatoire telles qu’indiquées dans le cahier. Les questions marquées « Question supplémentaire » ont été créées pour cette plateforme à partir des notions du cahier.</p></section>';
    v.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-reset')) $('#rz', v).innerHTML = '<div class="confirm" style="margin-top:12px"><b>Effacer toute ta progression?</b><p style="margin:6px 0 10px">Réponses, XP, badges et examens seront supprimés de ce navigateur. Cette action est définitive.</p><div class="btn-row"><button class="btn primary" data-rzy>Oui, tout effacer</button><button class="btn" data-rzn>Annuler</button></div></div>';
      if (b.hasAttribute('data-rzn')) $('#rz', v).innerHTML = '';
      if (b.hasAttribute('data-rzy')) { state = fresh(); try { localStorage.removeItem(KEY); } catch (er) { } renderXP(); $('#rz', v).innerHTML = '<p class="status ok" style="margin-top:12px">Progression effacée.</p>'; }
    });
  };

  /* ---------------------------------------------------------------- démarrage */
  function boot() {
    main = $('#main');
    var tb = $('.topbar'); function setTb() { document.documentElement.style.setProperty('--tb', tb.offsetHeight + 'px'); } setTb(); window.addEventListener('resize', setTb);
    var errs = Core.validate(D);
    if (errs.length && window.console) console.warn('Validation du contenu :', errs);
    var NI = { home: 'home', parcours: 'route', fiches: 'cards', exam: 'exam', defis: 'trophy', about: 'info' };
    $$('.nav button').forEach(function (b) { b.insertAdjacentHTML('afterbegin', IC(NI[b.dataset.v], 'sm')); b.addEventListener('click', function () { go(b.dataset.v); }); });
    $('#brand').addEventListener('click', function () { go('home'); });
    $('#xp').addEventListener('click', function () { go('home'); });
    renderXP();
    var h = (location.hash || '').slice(1);
    var map = { accueil: 'home', parcours: 'parcours', fiches: 'fiches', examen: 'exam', defis: 'defis', apropos: 'about' };
    if (D.notions[h]) go('notion', { n: h }, { noFocus: true });
    else if (/^c[1-4]$/.test(h)) go('chapter', { c: h }, { noFocus: true });
    else go(map[h] || 'home', null, { noFocus: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
