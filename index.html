<style>/* Concept : un atlas illustré du vivant. Bandeau « océan profond » pour l'en-tête et l'accueil,
   planches illustrées numérotées comme dans un manuel, une couleur par chapitre (strates du cahier). */
:root {
  --bg: #EDF2F3; --surface: #FFFFFF; --surface-2: #F3F7F8; --ink: #0F2330; --muted: #4F6370; --line: #D2DDE2; --plate: #F8FBFA;
  --ocean: #0F2B3A; --ocean-2: #163E52; --on-ocean: #EAF4F6; --on-ocean-muted: #A9C3CC;
  --accent: #0A8571; --accent-ink: #FFFFFF; --accent-soft: #DDF1EC; --amber: #A2600C; --amber-soft: #F7E9D3;
  --ok: #1D7A44; --ok-soft: #E0F3E7; --bad: #B4312A; --bad-soft: #FBE5E2;
  --c1: #0A8571; --c2: #6B4DC0; --c3: #B8690C; --c4: #96583A;
  --c1-soft: #DDF1EC; --c2-soft: #ECE6FA; --c3-soft: #F8EAD5; --c4-soft: #F3E5DC;
  --e-pre: #D9D2EC; --e-paleo: #CDE3D7; --e-meso: #F0DDB6; --e-ceno: #F2CBB8;
  --mom: #18A189; --dad: #E08A1E; --sv-fill: #E6EDEA; --sv-fill-2: #CFDCD6; --sv-stroke: #3D5149; --water: #CFE6EC; --rock-1: #D9CBB0; --rock-2: #C4B08E; --rock-3: #B79F7A; --rock-4: #9E8A6C;
  --fig-stroke: #2C3E46;
  --shadow-1: 0 1px 2px rgba(15,35,48,.06), 0 2px 8px rgba(15,35,48,.05);
  --shadow-2: 0 2px 4px rgba(15,35,48,.06), 0 12px 32px rgba(15,35,48,.10);
  --f-display: "Unbounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px; --r-lg: 20px; --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B151B; --surface: #12212A; --surface-2: #182A34; --ink: #E4EEF1; --muted: #9BB0BA; --line: #27404B; --plate: #172A33;
    --ocean: #0A1C26; --ocean-2: #123242; --on-ocean: #EAF4F6; --on-ocean-muted: #A9C3CC;
    --accent: #3CCBAE; --accent-ink: #052019; --accent-soft: #113A32; --amber: #E8A852; --amber-soft: #3A2B15;
    --ok: #52C784; --ok-soft: #12321F; --bad: #F2786E; --bad-soft: #3B1B19;
    --c1: #3CCBAE; --c2: #A88CF2; --c3: #E8A852; --c4: #D79B78;
    --c1-soft: #113A32; --c2-soft: #2A2245; --c3-soft: #3A2B15; --c4-soft: #3A251B;
    --e-pre: #3A3357; --e-paleo: #22463A; --e-meso: #50401F; --e-ceno: #5A3628;
    --mom: #34C3A3; --dad: #E3A04A; --sv-fill: #22302B; --sv-fill-2: #2D3E37; --sv-stroke: #A9BDB4; --water: #183840; --rock-1: #4A4234; --rock-2: #5A4E3B; --rock-3: #6A5B44; --rock-4: #3D3528;
    --fig-stroke: #B9CCD3;
    --shadow-1: 0 1px 2px rgba(0,0,0,.3); --shadow-2: 0 2px 4px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B151B; --surface: #12212A; --surface-2: #182A34; --ink: #E4EEF1; --muted: #9BB0BA; --line: #27404B; --plate: #172A33;
  --ocean: #0A1C26; --ocean-2: #123242; --on-ocean: #EAF4F6; --on-ocean-muted: #A9C3CC;
  --accent: #3CCBAE; --accent-ink: #052019; --accent-soft: #113A32; --amber: #E8A852; --amber-soft: #3A2B15;
  --ok: #52C784; --ok-soft: #12321F; --bad: #F2786E; --bad-soft: #3B1B19;
  --c1: #3CCBAE; --c2: #A88CF2; --c3: #E8A852; --c4: #D79B78;
  --c1-soft: #113A32; --c2-soft: #2A2245; --c3-soft: #3A2B15; --c4-soft: #3A251B;
  --e-pre: #3A3357; --e-paleo: #22463A; --e-meso: #50401F; --e-ceno: #5A3628;
  --mom: #34C3A3; --dad: #E3A04A; --sv-fill: #22302B; --sv-fill-2: #2D3E37; --sv-stroke: #A9BDB4; --water: #183840; --rock-1: #4A4234; --rock-2: #5A4E3B; --rock-3: #6A5B44; --rock-4: #3D3528;
  --fig-stroke: #B9CCD3;
  --shadow-1: 0 1px 2px rgba(0,0,0,.3); --shadow-2: 0 2px 4px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ocean); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.18; text-wrap: balance; margin: 0; letter-spacing: -0.015em; }
h1 { font-size: clamp(1.7rem, 4.2vw, 2.6rem); font-weight: 700; }
h2 { font-size: clamp(1.2rem, 2.6vw, 1.55rem); font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 600; }
h4 { font-size: .98rem; font-weight: 600; }
p { margin: 0 0 .75em; }
ul, ol { margin: 0 0 .8em; padding-left: 1.25em; }
li { margin: .25em 0; }
small { color: var(--muted); }
sup, sub { line-height: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.mono, .num, .tab { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 16px; height: 16px; }
.ico.lg { width: 24px; height: 24px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 60; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 10px; font-weight: 700; text-decoration: none; }
.skip:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }

/* ---------- Structure ---------- */
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ocean); color: var(--on-ocean); box-shadow: 0 1px 0 rgba(255,255,255,.06); }
.topbar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 2px; cursor: pointer; min-width: 0; color: inherit; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-size: .95rem; font-weight: 650; white-space: nowrap; letter-spacing: -.01em; }
.brand span { display: block; font-size: .7rem; color: var(--on-ocean-muted); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.brand-txt { text-align: left; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; justify-content: center; }
.nav::-webkit-scrollbar { display: none; }
.nav button { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 9px 13px; min-height: 42px; border-radius: 999px; cursor: pointer; white-space: nowrap; color: var(--on-ocean-muted); font-weight: 700; font-size: .9rem; transition: background .2s var(--ease), color .2s var(--ease); }
.nav button:hover { background: rgba(255,255,255,.08); color: var(--on-ocean); }
.nav button[aria-current="page"] { color: #062019; background: #5FE0BF; }
.xp-pill { flex: none; display: flex; align-items: center; gap: 8px; font-size: .8rem; background: rgba(255,255,255,.08); color: var(--on-ocean); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 4px 12px 4px 4px; min-height: 40px; cursor: pointer; }
.xp-pill .lv { background: #F2C14E; color: #2A1E05; border-radius: 999px; padding: 4px 9px; font-weight: 700; font-family: var(--f-mono); }
@media (max-width: 900px) {
  .topbar .wrap { flex-wrap: wrap; gap: 6px 10px; }
  .brand span { display: none; }
  .nav { order: 3; flex-basis: 100%; justify-content: flex-start; margin-inline: -4px; }
  .xp-pill { margin-left: auto; }
}
main { padding-block: 26px 70px; min-height: 70vh; }
main:focus { outline: none; }
.view > * + * { margin-top: 24px; }
.foot { border-top: 1px solid var(--line); padding-block: 20px; color: var(--muted); font-size: .85rem; }
.foot .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }

/* ---------- Composants de base ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(16px, 3vw, 26px); box-shadow: var(--shadow-1); min-width: 0; }
.card.flat { box-shadow: none; }
.eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; text-align: center; line-height: 1.2; transition: transform .15s var(--ease), border-color .2s, background .2s, filter .2s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { border-color: var(--line); }
.btn.small { min-height: 40px; padding: 7px 13px; font-size: .9rem; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 11px; font-size: .8rem; color: var(--muted); }
.chip b { color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: .02em; }
.pill.d1 { background: var(--ok-soft); color: var(--ok); }
.pill.d2 { background: var(--amber-soft); color: var(--amber); }
.pill.d3 { background: var(--bad-soft); color: var(--bad); }
.pill.st-done { background: var(--ok-soft); color: var(--ok); }
.pill.st-go { background: var(--amber-soft); color: var(--amber); }
.pill.st-new { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sc, var(--accent)); border-radius: 99px; transition: width .5s var(--ease); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 800px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.muted { color: var(--muted); }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.c1 { --sc: var(--c1); --sc-soft: var(--c1-soft); } .c2 { --sc: var(--c2); --sc-soft: var(--c2-soft); } .c3 { --sc: var(--c3); --sc-soft: var(--c3-soft); } .c4 { --sc: var(--c4); --sc-soft: var(--c4-soft); }

/* ---------- Accueil ---------- */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 10px; align-items: center; background: radial-gradient(120% 140% at 85% 10%, var(--ocean-2), var(--ocean) 60%); color: var(--on-ocean); border-radius: 28px; padding: clamp(22px, 4vw, 44px); overflow: hidden; box-shadow: var(--shadow-2); }
.hero .eyebrow { color: #7FE6CD; }
.hero h1 { color: #fff; }
.hero h1 em { font-style: normal; color: #5FE0BF; }
.hero .lede { font-size: 1.08rem; color: var(--on-ocean-muted); max-width: 52ch; margin: 14px 0 20px; }
.hero .btn { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #fff; }
.hero .btn:hover { border-color: #5FE0BF; }
.hero .btn.primary { background: #5FE0BF; color: #062019; border-color: #5FE0BF; box-shadow: 0 6px 20px rgba(95,224,191,.25); }
.hero-art { width: 100%; height: auto; display: block; max-width: 500px; margin-left: auto; }
.hero-last { margin: 14px 0 0; font-size: .92rem; color: var(--on-ocean-muted); }
.hero-last b { color: #fff; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero-art { max-width: 340px; margin: 0 auto; order: -1; } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow-1); display: flex; gap: 12px; align-items: center; }
.stat .si { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.stat .v { font-family: var(--f-mono); font-size: 1.35rem; font-weight: 700; display: block; line-height: 1.1; }
.stat .k { font-size: .8rem; color: var(--muted); line-height: 1.3; display: block; }
@media (max-width: 640px) { .stats { grid-template-columns: minmax(0, 1fr); } }
.sec-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ch-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 960px) { .ch-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .ch-cards { grid-template-columns: minmax(0, 1fr); } }
.ch-card { display: flex; flex-direction: column; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; overflow: hidden; cursor: pointer; padding: 0; box-shadow: var(--shadow-1); transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.ch-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: var(--sc); }
.ch-card .cv { background: var(--sc-soft); aspect-ratio: 5 / 3; max-width: 100%; display: grid; place-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ch-card .cv svg { width: 100%; height: 100%; }
.ch-card .cb { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.ch-card .cn { font-family: var(--f-mono); font-size: .75rem; font-weight: 700; color: var(--sc); letter-spacing: .06em; text-transform: uppercase; }
.ch-card b { font-family: var(--f-display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.ch-card small { display: block; }
.ch-card .cp { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 6px; }
.ch-card .cp .bar { flex: 1; }
.ch-card .cp span { font-family: var(--f-mono); font-weight: 700; font-size: .85rem; }
.quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.quick-grid div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; }
.quick-grid b { font-family: var(--f-mono); display: block; font-size: 1.02rem; color: var(--accent); }
.quick-grid span { font-size: .82rem; color: var(--muted); }
.reco { display: flex; flex-direction: column; gap: 8px; }
.reco button { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; cursor: pointer; width: 100%; min-height: 56px; transition: border-color .2s, transform .15s var(--ease); }
.reco button:hover { border-color: var(--sc, var(--accent)); }
.reco button:active { transform: scale(.99); }
.reco .dot { width: 34px; height: 34px; border-radius: 10px; background: var(--sc-soft); color: var(--sc); flex: none; display: grid; place-items: center; font: 700 .8rem var(--f-mono); }
.reco .rt { flex: 1; min-width: 0; }
.reco .rt b { display: block; }
.reco .rt small { display: block; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 14px 8px; border-radius: 16px; border: 1.5px dashed var(--line); color: var(--muted); font-size: .8rem; }
.badge svg { width: 44px; height: 44px; }
.badge b { color: var(--muted); font-size: .85rem; }
.badge.on { border-style: solid; border-color: var(--amber); background: var(--amber-soft); color: var(--ink); }
.badge.on b { color: var(--ink); }
.lvl-bar { display: flex; align-items: center; gap: 10px; }
.lvl-bar .bar { flex: 1; height: 10px; }
.lvl-bar .bar > i { background: linear-gradient(90deg, var(--accent), #F2C14E); }

/* ---------- Parcours / chapitre ---------- */
.ch-block { border-top: 6px solid var(--sc); }
.ch-block .ch-h { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-bottom: 14px; }
.ch-block .ch-h .cvs { width: 112px; flex: none; background: var(--sc-soft); border-radius: 14px; padding: 6px 8px; aspect-ratio: 5 / 3; max-width: 100%; }
.ch-block .ch-h .cvs svg { width: 100%; height: 100%; display: block; }
.ch-block .ch-h .tt { flex: 1; min-width: 200px; }
.notion-list { display: grid; gap: 8px; }
.notion-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); cursor: pointer; text-align: left; width: 100%; min-height: 60px; transition: border-color .2s, transform .15s var(--ease); }
.notion-row:hover { border-color: var(--sc); }
.notion-row:active { transform: scale(.995); }
.notion-row .ix { font-family: var(--f-mono); color: var(--sc); font-weight: 700; background: var(--sc-soft); border-radius: 10px; padding: 6px 8px; font-size: .85rem; }
.notion-row .nt b { display: block; }
.notion-row .nt small { display: block; }
.notion-row .nm { display: flex; align-items: center; gap: 8px; }
@media (max-width: 520px) { .notion-row .nm .pill { display: none; } }
.ring { width: 40px; height: 40px; flex: none; }

/* ---------- Notion ---------- */
.n-banner { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 18px; align-items: center; background: var(--sc-soft); border: 1px solid color-mix(in srgb, var(--sc) 25%, var(--line)); border-radius: 24px; padding: clamp(18px, 3.5vw, 30px); overflow: hidden; }
.n-banner .cvs { width: 100%; aspect-ratio: 5 / 3; max-width: 100%; }
.n-banner .cvs svg { width: 100%; height: 100%; display: block; }
@media (max-width: 700px) { .n-banner { grid-template-columns: minmax(0, 1fr); } .n-banner .cvs { display: none; } }
.n-head { display: flex; flex-direction: column; gap: 12px; }
.crumb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .88rem; color: var(--muted); }
.crumb button { background: none; border: 0; padding: 4px 0; color: var(--sc); font-weight: 700; cursor: pointer; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; }
.sec-nav-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding-block: 8px; margin-top: 16px !important; }
@media (max-width: 900px) { .sec-nav-wrap { top: calc(env(safe-area-inset-top, 0px) + 108px); } html { scroll-padding-top: 170px; } }
.sec-nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.sec-nav::-webkit-scrollbar { display: none; }
.sec-nav button { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; min-height: 40px; font-size: .85rem; font-weight: 700; cursor: pointer; color: var(--muted); transition: color .2s, border-color .2s, background .2s; }
.sec-nav button:hover { color: var(--ink); border-color: var(--sc); }
.sec-nav button.on { background: var(--sc); color: var(--surface); border-color: var(--sc); }
.sec { scroll-margin-top: 150px; }
.sec-h { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.sec-h .tag { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--sc-soft); color: var(--sc); flex: none; }
.sec-h .tag + div small { display: block; font: 700 .7rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--sc); }
.intro-q { font-family: var(--f-display); font-size: clamp(1.15rem, 2.6vw, 1.5rem); font-weight: 600; color: var(--sc); margin-bottom: 10px; line-height: 1.3; }
.objectif { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 12px 16px; }
.objectif .ico { color: var(--sc); margin-top: 3px; }
.theory-b + .theory-b { margin-top: 22px; padding-top: 22px; border-top: 1px dashed var(--line); }
.theory-b h3 { margin-bottom: 10px; }
.prose { max-width: 72ch; }
.def { border: 1px solid var(--line); border-left: 4px solid var(--sc, var(--accent)); background: var(--surface-2); border-radius: 12px; padding: 11px 15px; margin: 8px 0; }
.def-t { display: block; font-family: var(--f-display); font-weight: 600; font-size: .95rem; margin-bottom: 3px; color: var(--sc, var(--accent)); }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 8px 0; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 8px 0; }
@media (max-width: 760px) { .duo, .trio { grid-template-columns: minmax(0, 1fr); } }
.duo .def, .trio .def { margin: 0; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
.chain span { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 5px 11px; font-weight: 700; font-size: .9rem; }
.chain span + span::before { content: "→"; color: var(--muted); margin-right: 8px; margin-left: -2px; font-weight: 400; }
.num-box { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; background: var(--surface-2); margin: 8px 0; }
.num-box .num { font-size: 1.4rem; font-weight: 700; color: var(--sc, var(--accent)); }
.note { font-size: .93rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }
.flag { font-size: .9rem; background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 50%, transparent); border-radius: 12px; padding: 9px 13px; color: var(--ink); }
.flag::before { content: "À noter — "; font-weight: 700; color: var(--amber); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .93rem; margin: 8px 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 8px 11px; vertical-align: top; text-align: left; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td + td, .tbl th + th { border-left: 1px solid var(--line); }
.tbl th { background: var(--surface-2); font-weight: 700; }
.scroll-x { overflow-x: auto; }
.geo { min-width: 520px; }
.geo .e-ceno td { background: color-mix(in srgb, var(--e-ceno) 45%, transparent); }
.geo .e-meso td { background: color-mix(in srgb, var(--e-meso) 45%, transparent); }
.geo .e-paleo td { background: color-mix(in srgb, var(--e-paleo) 45%, transparent); }
.geo .e-pre td { background: color-mix(in srgb, var(--e-pre) 45%, transparent); }
.timeline { list-style: none; padding: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.timeline li { padding-left: 16px; position: relative; margin: 10px 0; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: .5em; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--sc, var(--accent)); }
.steps { counter-reset: s; list-style: none; padding: 0; }
.steps li { counter-increment: s; position: relative; padding-left: 38px; margin: 10px 0; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 27px; height: 27px; border-radius: 9px; background: var(--sc, var(--accent)); color: var(--surface); font-family: var(--f-mono); font-weight: 700; display: grid; place-items: center; font-size: .85rem; }
.schema { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 10px 0; }
.sc-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sc-cell { border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 9px 13px; text-align: center; font-size: .9rem; }
.sc-arrow { font-size: .85rem; color: var(--muted); }
.sc-arrow::before { content: "↓ "; }
.mol-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.mol-grid > div { border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.mol-grid .f { font-family: var(--f-mono); font-size: 1.15rem; color: var(--sc, var(--accent)); font-weight: 700; }
.mol-grid .mol-big { grid-column: 1 / -1; }
@media (max-width: 560px) { .mol-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.errs { border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-soft); border-radius: 14px; padding: 13px 16px; }
.errs h4 { display: flex; align-items: center; gap: 8px; color: var(--bad); margin-bottom: 6px; }
.errs ul { margin: 0; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Figures (planches illustrées) ---------- */
.figs { display: grid; gap: 18px; }
.figure { margin: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--plate); overflow: hidden; }
.fig-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
.fig-n { font: 700 .74rem var(--f-mono); color: var(--surface); background: var(--sc, var(--accent)); border-radius: 8px; padding: 3px 8px; flex: none; }
.fig-h h3 { font-size: .98rem; flex: 1; min-width: 0; }
.fig-zoom { flex: none; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); }
.fig-zoom:hover { color: var(--ink); border-color: var(--sc); }
.fig-body { padding: 10px 14px 4px; overflow-x: auto; }
.fig-body svg { display: block; width: 100%; height: auto; min-width: 460px; }
.figure figcaption { padding: 6px 16px 14px; font-size: .92rem; color: var(--muted); max-width: 80ch; }
.figure svg .t { fill: var(--ink); font: 600 13px var(--f-body); }
.figure svg .tb, .lightbox svg .tb { fill: var(--ink); font: 700 13.5px var(--f-body); }
.figure svg .tm, .lightbox svg .tm { fill: var(--muted); font: 400 12px var(--f-body); }
.figure svg .tmono, .lightbox svg .tmono { fill: var(--muted); font: 700 11.5px var(--f-mono); }
.figure svg .tf, .lightbox svg .tf { fill: var(--sc, var(--accent)); font: 700 15px var(--f-mono); }
.figure svg .tacc, .lightbox svg .tacc { fill: var(--accent); font: 700 12px var(--f-body); }
.figure svg .tbig, .lightbox svg .tbig { fill: var(--ink); font: 700 26px var(--f-display); }
.figure svg .tlay, .lightbox svg .tlay { fill: #2A241B; font: 700 12.5px var(--f-body); }
.lightbox svg .t { fill: var(--ink); font: 600 13px var(--f-body); }
svg .s1 { stroke: #3A4A50; stroke-width: 1.6; stroke-linejoin: round; }
svg .ll { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg .lld { fill: var(--ink); }
svg .arw { stroke: var(--muted); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg .pn { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
svg .bdg { fill: var(--sc, var(--accent)); }
svg .bdgt { fill: var(--surface); font: 700 12px var(--f-mono); }
svg .ax { stroke: var(--fig-stroke); stroke-width: 2; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .dotA { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
svg .lens { fill: #FFFFFF; stroke: var(--fig-stroke); stroke-width: 2.5; }
svg .cen { fill: #2C3E46; }
svg .bnd { stroke: #6E7C82; stroke-width: 5; stroke-linecap: round; }
svg .bl { fill: #fff; font: 700 9.5px var(--f-mono); }
svg .barf { fill: var(--sc, var(--accent)); }
svg .barf2 { fill: var(--amber); }
svg .dash { stroke: #2C3E46; stroke-width: .8; stroke-dasharray: 2 2; }
.lightbox { position: fixed; inset: 0; z-index: 70; background: rgba(5,15,20,.72); display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadeIn .2s var(--ease); }
.lightbox .lb-in { background: var(--plate); border-radius: 20px; max-width: min(1100px, 100%); max-height: 100%; overflow: auto; padding: 14px; box-shadow: var(--shadow-2); }
.lightbox .lb-h { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.lightbox .lb-h h3 { flex: 1; }
.lightbox svg { width: 100%; height: auto; display: block; min-width: 640px; }
.lightbox .lb-scroll { overflow-x: auto; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Simulations ---------- */
.sim { border: 1px solid var(--line); border-radius: 18px; background: var(--surface-2); padding: 16px; }
.sim-consigne { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.sim-consigne b { color: var(--sc); flex: none; display: inline-flex; align-items: center; gap: 6px; }
.sim-stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.sim-stage.single { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 760px) { .sim-stage { grid-template-columns: minmax(0, 1fr); } }
.sim svg { width: 100%; height: auto; display: block; }
.sim-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; min-width: 0; }
.sim-panel h4 { margin-bottom: 6px; }
.sim-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 13px; min-height: 42px; cursor: pointer; font-weight: 700; font-size: .88rem; color: var(--muted); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--sc, var(--accent)); color: var(--surface); }
.sim-obs { margin-top: 12px; display: grid; gap: 8px; }
.sim-obs .o { border-left: 3px solid var(--amber); padding-left: 10px; font-size: .95rem; }
.hot { cursor: pointer; }
.hot:focus { outline: none; }
.hot:focus-visible .hot-ring, .hot:hover .hot-ring { stroke: var(--amber); stroke-width: 3; }
.hot.sel .hot-ring { fill: var(--amber); }
.hot.sel .hot-txt { fill: var(--surface); }
.hot-ring { fill: var(--surface); stroke: var(--sv-stroke); stroke-width: 1.5; }
.hot-txt { fill: var(--ink); font: 700 11px var(--f-mono); }
.part { cursor: pointer; transition: opacity .2s; }
.part:hover, .part:focus-visible { filter: drop-shadow(0 0 3px var(--amber)); outline: none; }
.part.sel { filter: drop-shadow(0 0 4px var(--amber)); }
.optical .organelle { opacity: 0; pointer-events: none; }
.range { width: 100%; accent-color: var(--sc, var(--accent)); min-height: 34px; }
.range-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.metric { font-family: var(--f-mono); font-weight: 700; color: var(--sc, var(--accent)); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .82rem; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.karyo { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 480px) { .karyo { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.karyo button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 2px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 700 .7rem var(--f-mono); color: var(--muted); min-height: 60px; }
.karyo button.sex { border-color: var(--amber); }
.karyo button.sel { background: var(--amber-soft); }
.karyo .pair { display: flex; gap: 3px; align-items: flex-end; height: 40px; }
.karyo .pair i { width: 7px; border-radius: 4px; display: block; }
.focus-view { aspect-ratio: 1; max-width: 240px; width: 100%; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 7px solid var(--sv-stroke); background: #F4F1E6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: .86rem; font-weight: 700; min-height: 40px; transition: background .2s, color .2s; }
.chips button[aria-pressed="true"] { background: var(--sc, var(--accent)); color: var(--surface); border-color: var(--sc, var(--accent)); }
.toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .toggles { grid-template-columns: minmax(0, 1fr); } }
.toggles button { display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 10px; border-radius: 12px; cursor: pointer; min-height: 50px; font-weight: 700; font-size: .9rem; }
.toggles button[aria-pressed="true"] { border-color: var(--sc, var(--accent)); background: var(--sc-soft, var(--accent-soft)); }
.toggles .sw { width: 32px; height: 19px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.toggles .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); transition: transform .2s var(--ease); }
.toggles button[aria-pressed="true"] .sw { background: var(--sc, var(--accent)); }
.toggles button[aria-pressed="true"] .sw::after { transform: translateX(13px); }
.status { padding: 10px 13px; border-radius: 12px; font-size: .95rem; border: 1px solid var(--line); background: var(--surface); }
.status.ok { border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: var(--ok-soft); }
.status.warn { border-color: color-mix(in srgb, var(--amber) 55%, transparent); background: var(--amber-soft); }
.reveal-btn { margin-top: 10px; }

/* Exemple résolu */
.ex-steps { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; counter-reset: e; }
.ex-steps li { counter-increment: e; padding: 10px 14px 10px 48px; position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); animation: rise .28s var(--ease) both; margin: 0; }
.ex-steps li::before { content: counter(e); position: absolute; left: 12px; top: 10px; width: 25px; height: 25px; border-radius: 8px; background: var(--sc); color: var(--surface); font: 700 .8rem var(--f-mono); display: grid; place-items: center; }
@keyframes rise { from { transform: translateY(6px); opacity: .3; } to { transform: none; opacity: 1; } }

/* ---------- Questions ---------- */
.qw { display: flex; flex-direction: column; gap: 13px; }
.qw-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .8rem; color: var(--muted); }
.qw-q { font-size: 1.1rem; font-weight: 700; margin: 0; max-width: 70ch; line-height: 1.45; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; cursor: pointer; min-height: 48px; transition: border-color .15s, background .15s; }
.opt:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.opt input { margin-top: 3px; accent-color: var(--accent); width: 19px; height: 19px; flex: none; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-bad, .ord li.is-bad, .mrow.is-bad, .short-in.is-bad { border-color: var(--bad) !important; background: var(--bad-soft) !important; }
.opt.is-ok, .ord li.is-ok, .mrow.is-ok, .short-in.is-ok { border-color: var(--ok) !important; background: var(--ok-soft) !important; }
.opt.is-ans { border-color: var(--ok); border-style: dashed; }
.tf-opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ord { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.ord li { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 8px 6px 12px; margin: 0; }
.ord li .pos { font-family: var(--f-mono); font-weight: 700; color: var(--muted); width: 1.5em; }
.ord li .lab { flex: 1; min-width: 0; }
.ord li button { width: 42px; height: 42px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; cursor: pointer; flex: none; }
.ord li button:disabled { opacity: .35; cursor: default; }
.mrows { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 11px; }
@media (max-width: 600px) { .mrow { grid-template-columns: minmax(0, 1fr); } }
.mrow select, .slot select { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); padding: 6px 8px; font: inherit; font-size: .93rem; }
.mrow .fix { grid-column: 1 / -1; font-size: .85rem; color: var(--ok); font-weight: 700; }
.short-in { width: 100%; max-width: 420px; min-height: 48px; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 13px; font: inherit; background: var(--surface); color: var(--ink); }
.short-in:focus { border-color: var(--accent); }
.fb { border-radius: 14px; padding: 12px 15px; font-size: .97rem; animation: rise .25s var(--ease) both; }
.fb.ok { background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 55%, transparent); }
.fb.bad { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 55%, transparent); }
.fb.info { background: var(--surface-2); border: 1px solid var(--line); }
.fb b.t { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-family: var(--f-display); font-weight: 600; }
.fb .btn-row { margin-top: 10px; }
.runner-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 14px; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dots button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font: 700 .74rem var(--f-mono); color: var(--muted); cursor: pointer; padding: 0; }
.dots button.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.dots button.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.dots button.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dots button.flagged { box-shadow: inset 0 -3px 0 var(--amber); }
.dots button.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.runner-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.filter { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Résumé / fiches ---------- */
.sum-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .sum-grid { grid-template-columns: minmax(0, 1fr); } }
.sum-grid > div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.sum-grid h4 { margin-bottom: 6px; color: var(--sc); }
.flash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.flash { border: 1px solid var(--line); border-top: 4px solid var(--sc); border-radius: 14px; background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.flash b { font-family: var(--f-display); font-weight: 600; font-size: .95rem; }
.flash .fd { font-size: .93rem; }
.flash .fd.masked { color: transparent; background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 6px, var(--line) 6px, var(--line) 7px); border-radius: 6px; user-select: none; }
.flash button { align-self: flex-start; }
.deck { max-width: 560px; margin: 0 auto; }
.deck-card { min-height: 240px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; padding: 26px; border: 1px solid var(--line); border-top: 6px solid var(--sc); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-2); animation: rise .25s var(--ease) both; }

      objectif: 'appliquer les principes de superposition et d’identité paléontologique et distinguer la datation relative de la datation absolue.',
      theory: [
        { h: 'La stratigraphie', html: '<div class="def"><span class="def-t">Stratigraphie</span>Science qui étudie la superposition des couches de roches afin d’expliquer les événements responsables de leur succession.</div><div class="def"><span class="def-t">Couche stratigraphique</span>Ensemble de dépôts sédimentaires ayant les <b>mêmes caractéristiques</b> : couleur, taille des particules, nature de la roche.</div>' },
        { h: 'Les grands principes', html: '<table class="tbl"><thead><tr><th>Principe</th><th>Explication</th></tr></thead><tbody><tr><td><b>Superposition</b></td><td>Les couches <b>les plus anciennes</b> se trouvent toujours <b>en dessous</b>, et les plus récentes sur le dessus.</td></tr><tr><td><b>Identité paléontologique</b></td><td>Deux couches qui contiennent <b>les mêmes types de fossiles</b> ont <b>le même âge</b>.</td></tr></tbody></table><p class="flag">Complément (exercice 7, p. 22) : une faille ou un filon de magma est <b>plus récent que les couches qu’il traverse</b>, car les couches devaient exister avant d’être coupées. Ce principe n’est pas écrit dans les notes du cahier, mais il est nécessaire pour réussir cet exercice.</p>' },
        { h: 'Deux méthodes de datation', html: '<div class="duo"><div class="def"><span class="def-t">Datation relative</span>Détermine l’<b>âge approximatif</b> d’une roche ou d’un fossile par l’examen de son <b>emplacement</b> dans un ensemble de couches superposées. Elle dit si c’est plus vieux ou plus jeune qu’autre chose.</div><div class="def"><span class="def-t">Datation absolue</span>Mesure la quantité de certains <b>éléments radioactifs</b> (qui se désintègrent avec le temps), comme l’<b>uranium</b> ou le <b>carbone 14</b>, pour déterminer l’âge <b>en années</b>, avec plus de précision.</div></div>' }
      ],
      defs: [
        { t: 'Stratigraphie', d: 'Science qui étudie la superposition des couches de roches.' },
        { t: 'Couche stratigraphique', d: 'Dépôts sédimentaires ayant la même couleur, la même taille de particules et la même nature de roche.' },
        { t: 'Principe de superposition', d: 'Les couches les plus anciennes sont en dessous, les plus récentes au-dessus.' },
        { t: 'Principe d’identité paléontologique', d: 'Deux couches avec les mêmes fossiles ont le même âge.' },
        { t: 'Datation relative', d: 'Âge approximatif selon la position dans les couches.' },
        { t: 'Datation absolue', d: 'Âge en années grâce aux éléments radioactifs (uranium, carbone 14).' }
      ],
      erreurs: [
        'Inverser relative et absolue : seule la datation absolue utilise la radioactivité et donne un âge précis.',
        'Croire que les couches permettent de dater précisément : elles donnent un âge relatif.'
      ],
      sim: { id: 'strates', title: 'Lis la coupe de terrain', consigne: 'Dépose des couches de sédiments les unes sur les autres, puis réponds aux défis de datation.', observe: 'Où se trouve toujours la couche la plus ancienne? Que se passe-t-il quand un filon de magma traverse les couches?', explique: 'Selon le principe de superposition, chaque nouvelle couche se dépose sur les précédentes : la plus ancienne est en bas. Un filon qui traverse des couches est plus récent qu’elles.' },
      exemple: {
        titre: 'Raisonner sur une coupe stratigraphique',
        enonce: 'Trois couches : la couche 1 (en haut) contient l’espèce B; la couche 2 contient les espèces A et B; la couche 3 (en bas) contient l’espèce B. Quelle espèce est apparue en premier?',
        steps: [
          '<b>Principe utilisé :</b> superposition — la couche la plus profonde est la plus ancienne.',
          '<b>Ordre des couches, de la plus ancienne à la plus récente :</b> 3, puis 2, puis 1.',
          '<b>Couche 3 (la plus ancienne) :</b> on n’y trouve que l’espèce B.',
          '<b>Conclusion :</b> l’espèce B existait déjà avant l’espèce A.',
          '<b>Réponse :</b> l’espèce B est apparue en premier. L’espèce A apparaît dans la couche 2, puis disparaît (extinction) puisqu’elle est absente de la couche 1.'
        ]
      },
      resume: {
        idees: ['Superposition : en bas = plus ancien.', 'Identité paléontologique : mêmes fossiles = même âge.', 'Relative = approximative (position); absolue = précise (radioactivité).'],
        retenir: ['Éléments radioactifs : uranium, carbone 14', 'Une faille ou un filon est plus récent que les couches qu’il traverse (complément)']
      },
      quick: { q: 'Quelle méthode de datation utilise le carbone 14?', a: 'La datation absolue.' }
    }
  };

    { t: 'mc', d: 1, q: 'Qu’est-ce que la division cellulaire?', c: ['Le processus qui donne naissance à de nouvelles cellules à partir d’une seule cellule mère', 'La mort programmée des cellules', 'La fusion de deux cellules', 'La copie de la membrane cellulaire'], a: 0, x: 'La division cellulaire permet de donner naissance à de nouvelles cellules à partir d’une seule cellule mère.', h: 'Une cellule mère → de nouvelles cellules.', src: 'Cahier p. 6' },
    { t: 'mc', d: 2, q: 'Une cellule somatique est…', c: ['une cellule du corps qui n’est pas sexuelle', 'un gamète', 'une cellule morte', 'une cellule sans noyau'], a: 0, x: 'Les cellules somatiques sont les cellules non sexuelles du corps (peau, muscle, os…).', h: 'L’exercice 7 dit « somatiques (non sexuelles) ».', src: 'Cahier p. 16, ex. 7' },
    { t: 'tf', d: 2, q: 'Un enfant grandit surtout parce que ses cellules grossissent sans se diviser.', a: false, x: 'Faux : la croissance vient surtout de l’augmentation du nombre de cellules par mitose.', h: 'Fonction « croissance » : augmenter le nombre…', src: SUPP }
  ]);

  add('n6', [
    { t: 'mc', d: 1, q: 'Que doit faire la cellule mère avant de se diviser par mitose?', c: ['Copier (répliquer) l’ADN de son noyau', 'Détruire son noyau', 'Perdre la moitié de ses chromosomes', 'Fusionner avec une autre cellule'], a: 0, x: 'Avant de se diviser, la cellule copie son ADN : c’est la réplication.', h: 'C’est le processus de réplication.', src: 'Cahier p. 7' },
    { t: 'order', d: 2, q: 'Place en ordre les étapes de la réplication et de la mitose.', c: ['La molécule d’ADN se déroule', 'L’échelle se sépare en deux comme une fermeture éclair', 'De nouvelles bases azotées se fixent sur chaque brin', 'Il y a deux molécules d’ADN identiques', 'Le matériel génétique se divise et forme deux noyaux', 'La cellule se divise en deux cellules filles'], x: 'Réplication (dérouler, séparer, compléter), puis division du matériel génétique et de la cellule.', h: 'La copie vient avant la division.', src: 'Cahier p. 7' },
    { t: 'mc', d: 1, q: 'Où sont fabriquées les nouvelles bases azotées qui se fixent sur les brins d’ADN?', c: ['Dans le cytoplasme', 'Dans la membrane cellulaire', 'À l’extérieur de la cellule', 'Dans les valets'], a: 0, x: 'Les nouvelles bases azotées sont fabriquées dans le cytoplasme.', h: 'C’est l’intérieur gélatineux de la cellule.', src: 'Cahier p. 7' },
    { t: 'mc', d: 1, q: 'Combien de chromosomes contient chaque cellule fille après une mitose chez l’humain?', c: ['46', '23', '92', '12'], a: 0, x: 'Chaque cellule fille possède 23 paires, soit 46 chromosomes, comme la cellule mère.', h: 'Les cellules filles sont identiques à la cellule mère.', src: 'Cahier p. 7' },
    { t: 'tf', d: 1, q: 'Les deux cellules filles de la mitose sont génétiquement identiques à la cellule mère.', a: true, x: 'Grâce à la réplication, chaque cellule fille reçoit une copie complète de l’ADN.', h: 'C’est la définition de la mitose.', src: 'Cahier p. 7' },
    { t: 'short', d: 2, q: 'Comment appelle-t-on une cellule « 2n », qui possède des paires de chromosomes?', kw: ['diplo'], x: 'Une cellule 2n est diploïde : elle possède 23 paires de chromosomes chez l’humain.', h: 'Le mot commence par « di » (deux).', src: 'Cahier p. 7' },
    { t: 'mc', d: 1, q: 'À quoi le cahier compare-t-il la séparation des deux brins d’ADN?', c: ['À une fermeture éclair', 'À une échelle qui brûle', 'À un ballon qui éclate', 'À une porte qui tourne'], a: 0, x: 'L’échelle d’ADN se sépare en deux comme une fermeture éclair.', h: 'On trouve cet objet sur un manteau.', src: 'Cahier p. 7' },
    { t: 'mc', d: 2, q: 'Une cellule se divise en 2, puis chacune se divise de nouveau. On obtient 4 cellules ayant toutes les mêmes chromosomes que la cellule de départ. Quel mode de division est représenté?', c: ['La mitose', 'La méiose'], a: 0, x: 'Mitose : chaque division produit des cellules identiques à la cellule mère, avec le même nombre de chromosomes.', h: 'Les chromosomes sont-ils identiques?', src: 'Cahier p. 15, ex. 6 b' },
    { t: 'mc', d: 3, q: 'Une cellule de la peau (46 chromosomes) subit deux mitoses successives. Combien de chromosomes possède chacune des 4 cellules obtenues?', c: ['46', '23', '11,5', '184'], a: 0, x: 'Chaque mitose conserve le nombre de chromosomes grâce à la réplication : 46 à chaque génération de cellules.', h: 'La mitose ne réduit jamais le nombre de chromosomes.', src: SUPP }
  ]);

  add('n7', [
    { t: 'match', d: 2, q: 'Indique si chaque énoncé se rapporte à la mitose, à la méiose ou aux deux.', opts: ['Mitose', 'Méiose', 'Les deux'], rows: [['Permet d’obtenir des cellules identiques à la cellule mère', 'Mitose'], ['Produit des cellules somatiques (non sexuelles)', 'Mitose'], ['Les cellules filles contiennent seulement 23 chromosomes', 'Méiose'], ['Produit des cellules diploïdes (une paire de chaque chromosome)', 'Mitose'], ['Permet la production d’ovules et de spermatozoïdes', 'Méiose'], ['Nécessite la réplication de l’ADN', 'Les deux'], ['Permet la croissance des individus', 'Mitose'], ['Assure la régénération des cellules mortes', 'Mitose'], ['Augmente la diversité génétique', 'Méiose']], x: 'La réplication de l’ADN a lieu dans les deux types de division. Le reste distingue la mitose (identique, diploïde, croissance) de la méiose (gamètes, 23 chromosomes, diversité).', h: 'Une seule ligne se rapporte aux deux.', src: 'Cahier p. 16, ex. 7' },
    { t: 'mc', d: 1, q: 'Quel type de cellules est formé lors d’une méiose?', c: ['Des gamètes (cellules sexuelles)', 'Des neurones', 'Des cellules de la peau', 'Des globules rouges'], a: 0, x: 'La méiose produit les gamètes : spermatozoïdes et ovules.', h: 'Elles servent à la reproduction.', src: 'Cahier p. 15, ex. 5' },
    { t: 'mc', d: 2, q: 'Une cellule se divise en 2, puis en 4 cellules qui ont chacune des chromosomes différents et deux fois moins de chromosomes que la cellule de départ. Quel mode de division est représenté?', c: ['La méiose', 'La mitose'], a: 0, x: 'Méiose : deux divisions, 4 cellules génétiquement différentes, avec la moitié des chromosomes.', h: 'Le nombre de chromosomes diminue.', src: 'Cahier p. 15, ex. 6 a' },
    { t: 'mc', d: 1, q: 'Dans quels organes se produit la méiose?', c: ['Les ovaires et les testicules', 'Le cœur et les poumons', 'L’estomac et l’intestin', 'Le cerveau et la moelle'], a: 0, x: 'La méiose s’effectue seulement dans les ovaires et les testicules.', h: 'Ce sont les organes reproducteurs.', src: 'Cahier p. 8' },
    { t: 'mc', d: 1, q: 'Combien de chromosomes contient un spermatozoïde humain?', c: ['23', '46', '22', '92'], a: 0, x: 'Les gamètes sont haploïdes : 23 chromosomes.', h: 'La moitié de 46.', src: 'Cahier p. 8' },
    { t: 'mc', d: 1, q: 'Combien de cellules filles obtient-on à la fin d’une méiose?', c: ['4', '2', '1', '8'], a: 0, x: 'La méiose comprend deux divisions : 1 → 2 → 4 cellules.', h: 'Il y a deux divisions successives.', src: 'Cahier p. 8' },
    { t: 'tf', d: 2, q: 'Lors de la 2e division de la méiose, l’ADN est copié de nouveau.', a: false, x: 'Faux : la 2e division se fait SANS réplication de l’ADN. C’est ce qui réduit le nombre de chromosomes de moitié.', h: 'Relis la légende du schéma.', src: 'Cahier p. 8' },
    { t: 'mc', d: 1, q: 'Qui sont les seuls individus génétiquement identiques?', c: ['Les jumeaux identiques', 'Tous les frères et sœurs', 'Les parents et leurs enfants', 'Les cousins'], a: 0, x: 'Grâce à la méiose, chaque humain est unique, sauf les jumeaux identiques.', h: 'Ils proviennent du même ovule fécondé.', src: 'Cahier p. 8' },
    { t: 'mc', d: 3, q: 'Pourquoi l’union d’un ovule et d’un spermatozoïde redonne-t-elle une cellule à 46 chromosomes?', c: ['Parce que chaque gamète apporte 23 chromosomes : 23 + 23 = 46', 'Parce que l’ovule contient déjà 46 chromosomes', 'Parce que le spermatozoïde perd ses chromosomes', 'Parce que la cellule copie son ADN deux fois'], a: 0, x: 'Chaque gamète est haploïde (23). Réunis, ils redonnent 23 paires : la cellule est de nouveau diploïde.', h: 'Additionne les chromosomes des deux gamètes.', src: SUPP },
    { t: 'mc', d: 3, q: 'Comment la diversité génétique produite par la méiose peut-elle protéger une espèce?', c: ['Si une maladie touche seulement certains individus, d’autres peuvent survivre', 'Elle rend tous les individus identiques et donc plus forts', 'Elle empêche toutes les maladies', 'Elle double le nombre de chromosomes'], a: 0, x: 'Comme les individus sont différents, une maladie ne touche pas nécessairement tout le monde : l’espèce peut survivre.', h: 'Relis la note au bas de la page 8.', src: 'Cahier p. 8' },
    { t: 'short', d: 1, q: 'Comment appelle-t-on le gamète femelle?', acc: ['ovule', 'un ovule', 'l\'ovule', 'ovules'], x: 'Le gamète femelle est l’ovule; le gamète mâle est le spermatozoïde.', h: 'C’est aussi la plus grosse cellule humaine.', src: 'Cahier p. 8' }
  ]);

  add('n8', [
    { t: 'tf', d: 1, q: 'Les premières formes de vie étaient des êtres unicellulaires ressemblant aux cyanobactéries d’aujourd’hui.', a: true, x: 'Les premières formes de vie étaient des unicellulaires apparentés aux cyanobactéries, qui existent encore.', h: 'Les cyanobactéries existent encore aujourd’hui.', src: 'Cahier p. 17, ex. 1 c' },
    { t: 'tf', d: 1, q: 'La vie est apparue sur Terre il y a environ 3,5 milliards d’années.', a: true, x: 'Vrai : environ 3,5 milliards d’années, après la formation des océans et de l’atmosphère.', h: 'La Terre a 4,6 milliards d’années.', src: 'Cahier p. 17, ex. 1 d' },
    { t: 'tf', d: 1, q: 'La vie est apparue en même temps que la Terre se formait.', a: false, x: 'Faux : la Terre s’est formée il y a 4,6 milliards d’années et la vie il y a 3,5 milliards d’années.', h: 'Compare les deux dates.', src: 'Cahier p. 17, ex. 1 e' },
    { t: 'mc', d: 1, q: 'Il y a combien de temps la Terre s’est-elle formée?', c: ['Environ 4,6 milliards d’années', 'Environ 3,5 milliards d’années', 'Environ 65 millions d’années', 'Environ 4 600 ans'], a: 0, x: 'Un nuage de gaz et de poussières a donné naissance au système solaire il y a environ 4,6 milliards d’années.', h: 'C’est le début du Précambrien.', src: 'Cahier p. 9' },
    { t: 'mc', d: 1, q: 'Selon le cahier, comment la Lune se serait-elle formée?', c: ['À la suite d’un impact entre la Terre et un corps céleste', 'Par la condensation de l’eau des océans', 'Par une éruption volcanique géante', 'Elle existait avant le Soleil'], a: 0, x: 'La Terre a été bombardée par de nombreux corps célestes; l’un des impacts serait à l’origine de la Lune.', h: 'La jeune Terre a été bombardée.', src: 'Cahier p. 9' },
    { t: 'tf', d: 2, q: 'La vie est apparue avant la formation des océans et de l’atmosphère.', a: false, x: 'Faux : la vie serait apparue APRÈS la formation des océans et de l’atmosphère.', h: 'La vie a besoin d’eau liquide.', src: 'Cahier p. 9' },
    { t: 'short', d: 3, q: 'Combien de milliards d’années se sont écoulés entre la formation de la Terre et l’apparition de la vie? (nombre seulement)', acc: ['1,1', '1,1milliard', '1,1milliards', '1100millions'], x: '4,6 − 3,5 = 1,1 milliard d’années.', h: 'Soustrais les deux dates.', src: SUPP },
    { t: 'mc', d: 1, q: 'Où le Soleil s’est-il formé?', c: ['Au centre du nuage de gaz et de poussières', 'À partir de la Terre', 'Après la formation de la Lune', 'À la suite de l’apparition de la vie'], a: 0, x: 'Le Soleil s’est formé au centre du nuage; la Terre vient de matière restée en orbite autour de lui.', h: 'Il est au centre du système solaire.', src: 'Cahier p. 9' }
  ]);

  add('n9', [
    { t: 'tf', d: 1, q: 'Pour constituer un être vivant, quatre éléments chimiques de base sont essentiels : C, H, O et N.', a: true, x: 'Carbone, hydrogène, oxygène et azote.', h: 'C’est la première condition favorable.', src: 'Cahier p. 17, ex. 1 a' },
    { t: 'tf', d: 1, q: 'La seule source d’énergie nécessaire au développement de la vie était, à l’origine, l’énergie des volcans.', a: false, x: 'Faux : il y avait aussi les rayons UV du Soleil et la foudre.', h: 'Le mot « seule » est un piège.', src: 'Cahier p. 17, ex. 1 b' },
    { t: 'mc', d: 1, q: 'La formule du méthane est CH₄. Que contient cette molécule?', c: ['1 atome de carbone et 4 atomes d’hydrogène', '4 atomes de carbone et 1 atome d’hydrogène', '1 atome de calcium et 4 atomes d’hélium', '1 atome de chlore et 4 atomes d’hydrogène'], a: 0, x: 'C = carbone (1 atome, pas d’indice) et H₄ = 4 atomes d’hydrogène.', h: 'L’indice suit l’élément qu’il compte.', src: 'Cahier p. 17, ex. 2 a' },
    { t: 'mc', d: 1, q: 'La formule de l’ammoniac est NH₃. Que contient cette molécule?', c: ['1 atome d’azote et 3 atomes d’hydrogène', '3 atomes d’azote et 1 atome d’hydrogène', '1 atome de néon et 3 atomes d’hydrogène', '1 atome de sodium et 3 atomes d’hydrogène'], a: 0, x: 'N = azote (1 atome) et H₃ = 3 atomes d’hydrogène.', h: 'N est le symbole de l’azote.', src: 'Cahier p. 17, ex. 2 b' },
    { t: 'multi', d: 1, q: 'Coche les sources d’énergie présentes sur la Terre primitive selon le cahier.', c: ['Rayons UV du Soleil', 'La foudre', 'Les éruptions volcaniques', 'L’électricité des centrales', 'Le pétrole'], a: [0, 1, 2], x: 'Les rayons UV, la foudre et les éruptions volcaniques.', h: 'Les deux derniers choix sont des inventions humaines.', src: 'Cahier p. 9' },
    { t: 'short', d: 2, q: 'Combien d’atomes au total contient une molécule de glucose, C₆H₁₂O₆? (nombre seulement)', acc: ['24'], x: '6 + 12 + 6 = 24 atomes.', h: 'Additionne les trois indices.', src: SUPP },
    { t: 'mc', d: 1, q: 'Quel est le symbole chimique de l’azote?', c: ['N', 'A', 'Az', 'Na'], a: 0, x: 'L’azote a pour symbole N (Na est le sodium).', h: 'On le retrouve dans NH₃.', src: 'Cahier p. 9' },
    { t: 'mc', d: 2, q: 'Pourquoi une très longue période de temps était-elle une condition favorable?', c: ['Plus le temps était long, plus il y avait d’agencements de molécules et de chances d’obtenir des cellules', 'Parce que la Terre devait refroidir pendant 4,6 milliards d’années', 'Parce que les dinosaures devaient disparaître', 'Parce que l’eau n’existait pas encore'], a: 0, x: 'Plus le temps disponible était long, plus le nombre d’agencements de molécules était élevé, et plus la probabilité d’obtenir des cellules était grande.', h: 'Pense aux probabilités.', src: 'Cahier p. 9' },
    { t: 'multi', d: 2, q: 'Coche les rôles de l’eau liquide dans l’apparition de la vie.', c: ['C’est le principal constituant des êtres vivants', 'C’est un milieu favorable à l’agencement de molécules complexes', 'Elle protégeait les premiers vivants des rigueurs du climat', 'C’était la principale source d’énergie'], a: [0, 1, 2], x: 'L’eau n’était pas une source d’énergie; les trois autres rôles sont dans le tableau du cahier.', h: 'Trois réponses sur quatre.', src: 'Cahier p. 9' },
    { t: 'mc', d: 1, q: 'Laquelle de ces molécules est une molécule complexe présente chez les êtres vivants?', c: ['Le glucose (C₆H₁₂O₆)', 'Le méthane (CH₄)', 'L’eau (H₂O)', 'Le gaz carbonique (CO₂)'], a: 0, x: 'Le glucose compte 24 atomes. Les trois autres sont des molécules simples de l’atmosphère primitive.', h: 'Elle contient le plus d’atomes.', src: 'Cahier p. 10' },
    { t: 'short', d: 1, q: 'Écris la formule chimique de l’eau.', acc: ['h2o'], x: 'H₂O : 2 atomes d’hydrogène et 1 atome d’oxygène.', h: '2 hydrogènes, 1 oxygène.', src: 'Cahier p. 10' }
  ]);

  add('n10', [
    { t: 'match', d: 1, q: 'Relie chaque mot à la bonne description.', rows: [['Extinction', 'Élimination de tous les individus d’une espèce'], ['Évolution', 'Modifications graduelles des caractéristiques d’une espèce au fil du temps'], ['Sélection naturelle', 'Survie des individus les mieux adaptés d’une espèce']], x: 'Évolution = modifications; sélection naturelle = tri; extinction = disparition de tous les individus.', h: 'Tri, modifications, disparition.', src: 'Cahier p. 17, ex. 3' },
    { t: 'mc', d: 1, q: 'La sélection naturelle favorise la reproduction d’organismes…', c: ['qui ont les caractéristiques facilitant la survie dans leur milieu', 'qui sont les plus nombreux dans leur milieu'], a: 0, x: 'Ce sont les mieux adaptés qui survivent et se reproduisent, pas forcément les plus nombreux.', h: 'Pense à « mieux adaptés ».', src: 'Cahier p. 18, ex. 6 a' },
    { t: 'mc', d: 2, q: 'Les premiers amphibiens sont issus…', c: ['de la transformation des nageoires de certains poissons en pattes', 'du croisement entre un poisson et un reptile'], a: 0, x: 'L’évolution modifie graduellement une espèce : des nageoires sont devenues des pattes. Un poisson et un reptile ne peuvent pas se croiser.', h: 'L’évolution transforme graduellement.', src: 'Cahier p. 18, ex. 6 b' },
    { t: 'mc', d: 1, q: 'Lorsqu’une espèce ne s’adapte pas aux changements du milieu…', c: ['elle est amenée à disparaître', 'elle survit plus difficilement, sans conséquence'], a: 0, x: 'Une espèce qui ne s’adapte pas finit par disparaître (extinction).', h: 'Pense à l’extinction.', src: 'Cahier p. 18, ex. 6 c' },
    { t: 'tf', d: 2, q: 'Une girafe allonge son cou à force de s’étirer pendant sa vie, puis transmet ce long cou à ses petits.', a: false, x: 'Faux : dans une population, certaines girafes ont déjà un cou plus long. Elles survivent mieux et ont plus de petits; c’est la population qui change au fil des générations.', h: 'La sélection naturelle agit sur des différences déjà présentes.', src: SUPP },
    { t: 'mc', d: 1, q: 'Selon la sélection naturelle, quels individus survivent?', c: ['Les mieux adaptés à leur milieu', 'Les plus gros', 'Les plus vieux', 'Ceux qui le décident'], a: 0, x: 'La sélection naturelle est un tri : seuls les organismes les mieux adaptés à leur milieu survivent.', h: 'Relis la définition.', src: 'Cahier p. 10' },
    { t: 'mc', d: 3, q: 'Des papillons clairs et foncés vivent sur des troncs devenus sombres. Les oiseaux repèrent facilement les papillons clairs. Que devrait-il arriver après plusieurs générations?', c: ['Les papillons foncés deviendront plus nombreux', 'Les papillons clairs deviendront foncés pour se cacher', 'Rien ne changera', 'Les oiseaux disparaîtront'], a: 0, x: 'Les papillons foncés, mieux camouflés, survivent et se reproduisent davantage : leur proportion augmente. Aucun papillon ne change de couleur pendant sa vie.', h: 'Qui est le mieux adapté à des troncs sombres?', src: SUPP },
    { t: 'tf', d: 2, q: 'Les extinctions massives ont favorisé le développement des espèces animales et végétales qui ont survécu.', a: true, x: 'Les survivants ont pu se diversifier et occuper les milieux laissés libres.', h: 'Pense aux mammifères après les dinosaures.', src: 'Cahier p. 19, ex. 7 b' },
    { t: 'short', d: 2, q: 'Nomme une espèce animale qui n’existe plus.', acc: ['mammouth', 'ammonite', 'trilobite', 'dinosaure', 'tyrannosaure', 'tyrannosaurus', 'ptérodactyle', 'pterodactyle', 'rhinoceros laineux', 'tigre a dents de sabre', 'smilodon', 'dodo', 'triceratops', 'diplodocus', 'velociraptor', 'stegosaure', 'mastodonte', 'ptéranodon', 'pteranodon', 'brontosaure', 'archeopteryx'], contains: true, x: 'Exemples : mammouth, ammonite, trilobite, dinosaures, ptérodactyle, rhinocéros laineux, tigre à dents de sabre.', h: 'Pense à l’ère glaciaire ou au Mésozoïque.', src: 'Cahier p. 19, ex. 10 c' },
    { t: 'mc', d: 2, q: 'L’évolution est…', c: ['un lent processus qui amène des modifications chez les organismes vivants', 'un changement rapide qui se fait en une génération', 'la disparition de toutes les espèces', 'la transformation volontaire d’un individu'], a: 0, x: 'L’évolution est un lent processus de modifications chez les organismes vivants.', h: 'Le mot clé est « lent ».', src: 'Cahier p. 10' }
  ]);

  add('n11', [
    { t: 'multi', d: 2, q: 'Qu’est-ce que l’échelle des temps géologiques? Coche les deux définitions qui s’appliquent.', c: ['L’histoire de la formation de la Terre', 'La division de l’histoire de la vie en quatre ères et en plusieurs périodes', 'Un outil servant à présenter les principaux épisodes de l’évolution de la vie', 'Une horloge décrivant l’histoire des êtres humains'], a: [1, 2], x: 'C’est une division de l’histoire de la vie en ères et périodes, et un outil pour présenter les épisodes de l’évolution.', h: 'Elle porte sur l’histoire de la vie.', src: 'Cahier p. 18, ex. 4' },
    { t: 'mc', d: 2, q: 'J’ai duré environ 300 millions d’années. J’ai débuté par la multiplication des invertébrés marins et j’ai pris fin par la disparition de 90 % des espèces marines. Qui suis-je?', c: ['Le Paléozoïque', 'Le Mésozoïque', 'Le Cénozoïque', 'Le Précambrien'], a: 0, x: 'Le Paléozoïque (543 à 245 Ma) se termine par l’extinction du Permien.', h: '« Paléo » = ancien; durée ≈ 300 Ma.', src: 'Cahier p. 18, ex. 5 a' },
    { t: 'mc', d: 2, q: 'Je suis témoin de l’apparition de la plupart des oiseaux actuels. J’ai vu évoluer les premiers primates et je dure depuis 65 millions d’années. Qui suis-je?', c: ['Le Cénozoïque', 'Le Mésozoïque', 'Le Paléozoïque', 'Le Précambrien'], a: 0, x: 'Le Cénozoïque a commencé il y a 65 Ma et se poursuit aujourd’hui.', h: 'C’est l’ère actuelle.', src: 'Cahier p. 18, ex. 5 b' },
    { t: 'mc', d: 2, q: 'Je couvre plus de 4 milliards d’années. Je suis marqué par l’apparition de la vie et j’ai pris fin il y a 543 millions d’années. Qui suis-je?', c: ['Le Précambrien', 'Le Paléozoïque', 'Le Mésozoïque', 'Le Cénozoïque'], a: 0, x: 'Le Précambrien va de 4 600 à 543 Ma.', h: 'C’est la plus longue des ères.', src: 'Cahier p. 18, ex. 5 c' },
    { t: 'mc', d: 2, q: 'J’ai connu beaucoup d’espèces de dinosaures. J’ai débuté il y a 245 millions d’années et je suis marqué par un épisode d’extinction massive. Qui suis-je?', c: ['Le Mésozoïque', 'Le Paléozoïque', 'Le Cénozoïque', 'Le Précambrien'], a: 0, x: 'Le Mésozoïque (245 à 65 Ma) est l’ère des dinosaures.', h: '« Méso » = milieu.', src: 'Cahier p. 18, ex. 5 d' },

    { t: 'tf', d: 2, q: 'Les géologues se spécialisent dans l’analyse et la recherche de fossiles.', a: false, x: 'Faux : ce sont les paléontologues.', h: 'Quel spécialiste étudie les fossiles?', src: 'Cahier p. 21, ex. 5 a' },

    { t: 'tf', d: 1, q: 'Tous les organismes qui meurent deviendront un jour des fossiles.', a: false, x: 'Faux : la plupart vont se décomposer.', h: 'Même idée qu’à l’exercice 3.', src: 'Cahier p. 21, ex. 5 c' },

    { t: 'tf', d: 1, q: 'La datation au carbone 14 est une méthode qui utilise la radioactivité pour connaître l’âge des fossiles.', a: true, x: 'Le carbone 14 est un élément radioactif utilisé en datation absolue.', h: 'Uranium et carbone 14.', src: 'Cahier p. 20, ex. 3 e' },

<script>/* Fonctions pures : correction, maîtrise, génération d'examen. Testées avec Node. */
var Core = (function () {
  function norm(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[’`´]/g, "'")
      .replace(/[₀-₉]/g, function (c) { return String(c.charCodeAt(0) - 0x2080); })
      .replace(/[¹²³⁰⁴-⁹]/g, function (c) { return ({ '¹': '1', '²': '2', '³': '3', '⁰': '0' })[c] || String(c.charCodeAt(0) - 0x2070); })
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/[.!?;:]+$/, '')
      .trim();
  }
  function key(s) {
    return norm(s)
      .replace(/^(le |la |les |un |une |des |l')/, '')
      .replace(/×/g, 'x')
      .replace(/\s+/g, '')
      .replace(/\./g, ',');
  }
  var NUM = /^\d+(,\d+)?$/;
  function leadingNumber(k) { var m = k.match(/^\d+(,\d+)?/); return m ? m[0] : null; }

  function gradeShort(q, ans) {

    if (!k) return false;

    var acc = q.acc || [];
    for (var i = 0; i < acc.length; i++) {
      var a = key(acc[i]);
      if (k === a) return true;
      if (q.contains && k.indexOf(a) !== -1) return true;
      if (NUM.test(a)) {
        var n = leadingNumber(k);
        if (n !== null && n === a) {
          // le reste doit être une unité ou un mot, pas un autre chiffre
          var rest = k.slice(n.length);
          if (!/^[\d,]/.test(rest)) return true;
        }
      }
    }
    return false;
  }

  function grade(q, r) {
    if (r == null) return false;
    switch (q.t) {
      case 'mc': return r === q.a;
      case 'tf': return r === q.a;
      case 'multi':
        if (!Array.isArray(r)) return false;
        var a = q.a.slice().sort(), b = r.slice().sort();
        return a.length === b.length && a.every(function (v, i) { return v === b[i]; });
      case 'order':
        return Array.isArray(r) && r.length === q.c.length && r.every(function (v, i) { return v === q.c[i]; });
      case 'match':
        return q.rows.every(function (row, i) { return r[i] === row[1]; });
      case 'short': return gradeShort(q, r);
    }
    return false;
  }

  /* Réponse complète? (pour l'examen : savoir si une question a été répondue) */
  function answered(q, r) {
    if (r == null) return false;
    if (q.t === 'multi') return Array.isArray(r) && r.length > 0;
    if (q.t === 'match') return q.rows.every(function (_, i) { return r[i]; });

    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }

  }

  /* Maîtrise estimée d'une notion : part des questions dont la DERNIÈRE réponse est bonne,
     combinée au meilleur score du test de maîtrise. */
  function notionMastery(data, state, nid) {
    var qs = data.questions.filter(function (q) { return q.n === nid; });
    if (!qs.length) return 0;
    var ok = qs.filter(function (q) { var h = state.answers[q.id]; return h && h.first; }).length;
    var practice = ok / qs.length;
    var t = state.tests[nid];
    var test = t ? t.best : 0;
    return Math.round((practice * 0.6 + test * 0.4) * 100);
  }
  function chapterMastery(data, state, cid) {
    var ch = data.chapters.filter(function (c) { return c.id === cid; })[0];
    var sum = ch.notions.reduce(function (s, n) { return s + notionMastery(data, state, n); }, 0);

  /* Répartition d'un nombre de questions selon des pondérations (plus grand reste). */
  function allocate(count, weights, caps) {

      guard++;

    return out;
  }

  function buildExam(data, opts) {

    var byCh = {};
    data.chapters.forEach(function (c) { byCh[c.id] = data.questions.filter(function (q) { return data.notions[q.n].ch === c.id; }); });
    var caps = {};

      var pools = ch.notions.map(function (nid) { return shuffle(byCh[cid].filter(function (q) { return q.n === nid; }), rand); });

  }

  /* Validation de cohérence du contenu */
  function validate(data) {
    var errs = [];
    var ids = {};
    data.chapters.forEach(function (c) {
      c.notions.forEach(function (n) {
        if (!data.notions[n]) errs.push('Notion manquante : ' + n);
        else if (data.notions[n].ch !== c.id) errs.push('Notion ' + n + ' associée au mauvais chapitre');
      });
    });
    Object.keys(data.notions).forEach(function (n) {
      var no = data.notions[n];
      ['title', 'pages', 'ref', 'objectif', 'theory', 'resume', 'quick'].forEach(function (f) { if (!no[f]) errs.push(n + ' : champ manquant ' + f); });
      var count = data.questions.filter(function (q) { return q.n === n; }).length;
      if (count < 5) errs.push(n + ' : moins de 5 questions (' + count + ')');
    });
    data.questions.forEach(function (q) {
      if (ids[q.id]) errs.push('Identifiant en double : ' + q.id);
      ids[q.id] = 1;
      if (!data.notions[q.n]) errs.push(q.id + ' : notion inconnue');
      if (!q.x) errs.push(q.id + ' : explication manquante');
      if (!q.h) errs.push(q.id + ' : indice manquant');
      if (!q.src) errs.push(q.id + ' : source manquante');
      if (!q.d || q.d < 1 || q.d > 3) errs.push(q.id + ' : difficulté invalide');
      if (q.t === 'mc' && (typeof q.a !== 'number' || !q.c || q.a >= q.c.length)) errs.push(q.id + ' : réponse mc invalide');
      if (q.t === 'tf' && typeof q.a !== 'boolean') errs.push(q.id + ' : réponse tf invalide');
      if (q.t === 'multi' && (!Array.isArray(q.a) || q.a.some(function (i) { return i >= q.c.length; }))) errs.push(q.id + ' : réponse multi invalide');
      if (q.t === 'order' && (!q.c || q.c.length < 3)) errs.push(q.id + ' : ordre invalide');
      if (q.t === 'match') {
        if (!q.rows || q.rows.length < 2) errs.push(q.id + ' : association invalide');
        if (q.opts) q.rows.forEach(function (r) { if (q.opts.indexOf(r[1]) === -1) errs.push(q.id + ' : option absente ' + r[1]); });
      }
      if (q.t === 'short' && !q.acc && !q.kw) errs.push(q.id + ' : réponse courte sans corrigé');
      if (['mc', 'tf', 'multi', 'order', 'match', 'short'].indexOf(q.t) === -1) errs.push(q.id + ' : type inconnu');

})();

      $(root, '#sr-svg').innerHTML = s;

<script>/* Application : navigation, progression, exercices, examen blanc, fiches, défis. */
(function () {

  /* ------------------------------------------------------------ état / stockage */

  var LEVELS = [[0, 'Observateur·rice'], [150, 'Apprenti·e biologiste'], [400, 'Explorateur·rice du vivant'], [800, 'Paléontologue junior'], [1300, 'Géologue de terrain'], [2000, 'Expert·e des origines']];
  function level() { var i = 0; LEVELS.forEach(function (l, j) { if (state.xp >= l[0]) i = j; }); var next = LEVELS[i + 1]; return { i: i, name: LEVELS[i][1], from: LEVELS[i][0], to: next ? next[0] : null }; }
  var BADGES = [
    ['scientifique', 'Scientifique en devenir', 'Réussir un premier test de maîtrise'],

    ['problemes', 'Expert en résolution de problèmes', 'Réussir 8 questions avancées du premier coup'],

  }

  function addXP(n, why) {

  }

    if (state.mystereDone) award('decodeur');

  }
  function renderXP() {

  }

  /* Enregistrer une tentative de question de la banque */
  function record(q, ok, tries, fromErrors) {

  }

  /* ------------------------------------------------------------ widget question */
  var DLAB = { 1: 'Facile', 2: 'Intermédiaire', 3: 'Avancé' };
  var TLAB = { mc: 'Choix multiple', tf: 'Vrai ou faux', multi: 'Plusieurs réponses', order: 'Mettre en ordre', match: 'Associer', short: 'Réponse courte' };
  function answerText(q) {
    switch (q.t) {
      case 'mc': return q.c[q.a];
      case 'tf': return q.a ? 'Vrai' : 'Faux';
      case 'multi': return q.a.map(function (i) { return q.c[i]; }).join(' · ');
      case 'order': return q.c.map(function (c, i) { return (i + 1) + '. ' + c; }).join('<br>');
      case 'match': return q.rows.map(function (r) { return r[0] + ' → <b>' + r[1] + '</b>'; }).join('<br>');

  }
  function shuffledOrder(q) { var s; var g = 0; do { s = Core.shuffle(q.c); g++; } while (g < 10 && s.every(function (v, i) { return v === q.c[i]; })); return s; }

  /* opt : { mode:'practice'|'exam'|'review', value, onChange(v), onAttempt(ok,tries), onTheory() } */
  function QW(q, opt) {

    if (q.t === 'multi' && !value) value = [];

    root.innerHTML = meta + '<p class="qw-q" id="' + id + '-q">' + q.q + '</p><div class="qw-body"></div>' + (mode === 'practice' ? '<div class="btn-row qw-act"><button class="btn primary" type="button" data-a="check">Vérifier</button></div>' : '') + '<div class="qw-fb" aria-live="polite"></div>';
    var body = $('.qw-body', root);

        var ord = q.t === 'tf' ? [0, 1] : q._ord;

  /* Test de maîtrise : 5 questions, une seule tentative, correction à la fin */
  function testIntro(box, n) {
    var t = state.tests[n];
    box.innerHTML = '<p>5 questions tirées au hasard dans cette notion, sans indice. Réussis-en au moins <b>4 sur 5</b> pour valider la notion. Le résultat compte dans ta maîtrise.</p>' + (t ? '<p class="status ' + (t.passed ? 'ok' : 'warn') + '">Meilleur résultat : ' + Math.round(t.best * 5) + '/5' + (t.passed ? ' · notion validée' : ' · encore un effort') + '</p>' : '') + '<div class="btn-row" style="margin-top:10px"><button class="btn primary" type="button" data-start>' + (t ? 'Refaire le test' : 'Commencer le test') + '</button></div>';

  }
  function runTest(box, n) {
    var pool = qsOf(n), ids = Core.shuffle(pool.map(function (q) { return q.id; })).slice(0, 5);

    function render() {
      var q = QBYID[ids[i]];

      $('#tslot', box).appendChild(QW(q, { mode: 'exam', value: resp[q.id], onChange: function (v) { resp[q.id] = v; } }));
      $('[data-p]', box).addEventListener('click', function () { i--; render(); });
      var nx = $('[data-nx]', box); if (nx) nx.addEventListener('click', function () { i++; render(); });
      var en = $('[data-end]', box); if (en) en.addEventListener('click', finish);
      box.scrollIntoView({ block: 'nearest' });
    }
    function finish() {
      var score = 0;
      ids.forEach(function (id) { var q = QBYID[id], ok = Core.grade(q, resp[id]); if (ok) score++; var h = state.answers[id] || { wrong: 0 }; if (ok && h.first === false) state.fixes++; h.first = ok; h.ok = ok; if (!ok) h.wrong = (h.wrong || 0) + 1; state.answers[id] = h; });
      var prev = state.tests[n], frac = score / 5, passed = score >= 4;
      var firstPass = passed && !(prev && prev.passed);
      state.tests[n] = { best: Math.max(prev ? prev.best : 0, frac), passed: (prev && prev.passed) || passed, last: frac };

  }
